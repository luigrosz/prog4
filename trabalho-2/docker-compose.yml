version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: daria-wiki-db
    environment:
      POSTGRES_USER: daria
      POSTGRES_PASSWORD: daria123
      POSTGRES_DB: daria_wiki
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
